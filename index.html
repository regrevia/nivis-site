<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6F0">
<title>月薪喵</title>
<style>
  :root {
    --paper: #FBF6F0;
    --fur: #D0B798;
    --cream: #FEFDFD;
    --ink: #63372B;
    --tear: #3E5EA3;
    --cycle: 1.07s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--paper); overflow: hidden;
    -webkit-tap-highlight-color: transparent; cursor: pointer; touch-action: manipulation; }
  .cat { width: min(82vmin, 30rem); height: auto; overflow: visible; display: block;
    transform-origin: 50% 96%; }
  .figure { transform-box: view-box; transform-origin: 50% 96%; }
  .fur { fill: var(--fur); }
  .blaze { fill: var(--cream); }
  .ink { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .tear { fill: var(--tear); }
  .mark { fill: var(--ink); }
  .drop { opacity: 0; }

  @keyframes hoist {
    0%   { transform: scale(1, 1); animation-timing-function: cubic-bezier(.5,0,.9,.55) }
    8%   { transform: scale(.805, .66); animation-timing-function: cubic-bezier(.2,0,.45,1) }
    15%  { transform: scale(.78, .625); animation-timing-function: cubic-bezier(.16,.52,.28,1) }
    48%  { transform: scale(1.008, 1.024); animation-timing-function: cubic-bezier(.38,0,.5,1) }
    64%  { transform: scale(.998, .996); animation-timing-function: cubic-bezier(.25,0,.5,1) }
    100% { transform: scale(1, 1) }
  }
  @keyframes armlag {
    0%   { transform: scaleY(1); animation-timing-function: cubic-bezier(.5,0,.9,.55) }
    8%   { transform: scaleY(1.055); animation-timing-function: cubic-bezier(.2,0,.45,1) }
    15%  { transform: scaleY(1.075); animation-timing-function: cubic-bezier(.16,.52,.28,1) }
    48%  { transform: scaleY(.988); animation-timing-function: cubic-bezier(.38,0,.5,1) }
    64%  { transform: scaleY(1.002); animation-timing-function: cubic-bezier(.25,0,.5,1) }
    100% { transform: scaleY(1) }
  }
  @keyframes scrub {
    0%     { transform: translate(0.00px,0.00px) rotate(0.00deg) }
    6.25%  { transform: translate(0.16px,0.11px) rotate(0.65deg) }
    12.5%  { transform: translate(0.30px,0.21px) rotate(1.20deg) }
    18.75% { transform: translate(0.39px,0.28px) rotate(1.57deg) }
    25%    { transform: translate(0.42px,0.30px) rotate(1.70deg) }
    31.25% { transform: translate(0.39px,0.28px) rotate(1.57deg) }
    37.5%  { transform: translate(0.30px,0.21px) rotate(1.20deg) }
    43.75% { transform: translate(0.16px,0.11px) rotate(0.65deg) }
    50%    { transform: translate(0.00px,0.00px) rotate(0.00deg) }
    56.25% { transform: translate(-0.16px,-0.11px) rotate(-0.65deg) }
    62.5%  { transform: translate(-0.30px,-0.21px) rotate(-1.20deg) }
    68.75% { transform: translate(-0.39px,-0.28px) rotate(-1.57deg) }
    75%    { transform: translate(-0.42px,-0.30px) rotate(-1.70deg) }
    81.25% { transform: translate(-0.39px,-0.28px) rotate(-1.57deg) }
    87.5%  { transform: translate(-0.30px,-0.21px) rotate(-1.20deg) }
    93.75% { transform: translate(-0.16px,-0.11px) rotate(-0.65deg) }
    100%   { transform: translate(-0.00px,-0.00px) rotate(-0.00deg) }
  }
  @keyframes padL {
    0%     { transform: translate(0.00px,0.00px) rotate(0.00deg) }
    6.25%  { transform: translate(0.08px,0.40px) rotate(0.99deg) }
    12.5%  { transform: translate(0.16px,0.74px) rotate(1.84deg) }
    18.75% { transform: translate(0.20px,0.97px) rotate(2.40deg) }
    25%    { transform: translate(0.22px,1.05px) rotate(2.60deg) }
    31.25% { transform: translate(0.20px,0.97px) rotate(2.40deg) }
    37.5%  { transform: translate(0.16px,0.74px) rotate(1.84deg) }
    43.75% { transform: translate(0.08px,0.40px) rotate(0.99deg) }
    50%    { transform: translate(0.00px,0.00px) rotate(0.00deg) }
    56.25% { transform: translate(-0.08px,-0.40px) rotate(-0.99deg) }
    62.5%  { transform: translate(-0.16px,-0.74px) rotate(-1.84deg) }
    68.75% { transform: translate(-0.20px,-0.97px) rotate(-2.40deg) }
    75%    { transform: translate(-0.22px,-1.05px) rotate(-2.60deg) }
    81.25% { transform: translate(-0.20px,-0.97px) rotate(-2.40deg) }
    87.5%  { transform: translate(-0.16px,-0.74px) rotate(-1.84deg) }
    93.75% { transform: translate(-0.08px,-0.40px) rotate(-0.99deg) }
    100%   { transform: translate(-0.00px,-0.00px) rotate(-0.00deg) }
  }
  @keyframes padR {
    0%     { transform: translate(0.00px,0.00px) rotate(0.00deg) }
    6.25%  { transform: translate(-0.08px,-0.40px) rotate(-0.99deg) }
    12.5%  { transform: translate(-0.16px,-0.74px) rotate(-1.84deg) }
    18.75% { transform: translate(-0.20px,-0.97px) rotate(-2.40deg) }
    25%    { transform: translate(-0.22px,-1.05px) rotate(-2.60deg) }
    31.25% { transform: translate(-0.20px,-0.97px) rotate(-2.40deg) }
    37.5%  { transform: translate(-0.16px,-0.74px) rotate(-1.84deg) }
    43.75% { transform: translate(-0.08px,-0.40px) rotate(-0.99deg) }
    50%    { transform: translate(-0.00px,-0.00px) rotate(-0.00deg) }
    56.25% { transform: translate(0.08px,0.40px) rotate(0.99deg) }
    62.5%  { transform: translate(0.16px,0.74px) rotate(1.84deg) }
    68.75% { transform: translate(0.20px,0.97px) rotate(2.40deg) }
    75%    { transform: translate(0.22px,1.05px) rotate(2.60deg) }
    81.25% { transform: translate(0.20px,0.97px) rotate(2.40deg) }
    87.5%  { transform: translate(0.16px,0.74px) rotate(1.84deg) }
    93.75% { transform: translate(0.08px,0.40px) rotate(0.99deg) }
    100%   { transform: translate(0.00px,0.00px) rotate(0.00deg) }
  }
  @keyframes pawrub {
    0%, 100% { transform: translate(-1.1px, 1.4px) rotate(-3deg) }
    50%      { transform: translate(1.2px, -1.5px) rotate(3deg) }
  }
  @keyframes curlrub {
    0%, 100% { transform: translate(0, 1.5px) rotate(4deg) }
    50%      { transform: translate(.3px, -1.5px) rotate(-4deg) }
  }
  @keyframes nod {
    0%, 100% { transform: rotate(-1.8deg) }
    50%      { transform: rotate(1.8deg) }
  }
  @keyframes sag {
    0%, 100% { transform: translateY(0) scale(1, 1) }
    50%      { transform: translateY(1.8%) scale(1.025, .955) }
  }
  @keyframes drip {
    0%, 56%   { opacity: 0; transform: translateY(0) }
    62%       { opacity: 1 }
    90%       { opacity: 1; transform: translateY(18px) }
    100%      { opacity: 0; transform: translateY(24px) }
  }

  body[data-pose="sway"] .figure { animation: hoist var(--cycle) linear infinite; }
  body[data-pose="sway"] .hand  { animation: armlag var(--cycle) linear infinite; animation-delay: calc(var(--cycle) * -.03); }
  body[data-pose="rub"]  .cat    { animation: nod 1.5s ease-in-out infinite; }
  .hand  { transform-box: view-box; transform-origin: 12.5px 40px; animation: scrub .62s linear infinite; }
  .pawg  { transform-box: view-box; animation: padL .6s linear infinite; }
  .pawg:first-of-type { transform-origin: 31.41px 72.16px; }
  .pawg:last-of-type  { transform-origin: 42.70px 72.16px; animation-name: padR; }
  .paw   { transform-box: view-box; transform-origin: 26px 47px; animation: pawrub .34s ease-in-out infinite; }
  .curl  { transform-box: view-box; transform-origin: 50px 48px; animation: curlrub .34s ease-in-out infinite; }
  body[data-pose="rub"]  .hand { animation-duration: .46s; }
  body[data-pose="rub"]  .paw,
  body[data-pose="rub"]  .curl { animation-duration: .26s; }
  body[data-pose="rub"]  .pawg { animation-duration: .46s; }
  body[data-pose="melt"] .hand { animation-duration: 1.1s; }
  body[data-pose="melt"] .paw,
  body[data-pose="melt"] .curl { animation-duration: 1.1s; }
  body[data-pose="melt"] .pawg { animation-duration: 1.6s; }
  body[data-pose="melt"] .cat    { animation: sag 3.2s ease-in-out infinite; }
  body[data-pose="melt"] .drop   { animation: drip 3.2s cubic-bezier(.4,0,.7,1) infinite; transform-box: view-box; transform-origin: 24px 27px; }

  @media (prefers-reduced-motion: reduce) {
    .cat, .figure, .hand, .paw, .pawg, .curl, .drop { animation: none !important; }
  }
</style>

<script>
(() => {
  const order = ['sway', 'rub', 'melt'];
  const body = document.body;
  const step = () => {
    const i = order.indexOf(body.dataset.pose);
    body.dataset.pose = order[(i + 1) % order.length];
  };
  const want = new URLSearchParams(location.search).get('p');
  const pinned = order.includes(want) ? want : '';
  let timer = 0;
  const cycle = () => { clearInterval(timer); timer = pinned ? 0 : setInterval(step, 7000); };
  if (pinned) { body.dataset.pose = pinned; }
  cycle();
  const bump = () => { step(); cycle(); };
  document.addEventListener('click', bump);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bump(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearInterval(timer); timer = 0; } else { cycle(); }
  });
})();
</script>
